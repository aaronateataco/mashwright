<?xml version="1.0" encoding="UTF-8"?>
<!-- Mashwright icon: an original quilt square (a half-square-triangle block, an economy block and
     plain patches, each with running stitches). Made for Mashwright; MIT licence like the app. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Mashwright</title>
  <defs>
    <clipPath id="quilt">
      <rect x="8" y="8" width="112" height="112" rx="22"/>
    </clipPath>
  </defs>

  <!-- backing cloth: shows through as the seams and the binding -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="#1f2a33"/>

  <g clip-path="url(#quilt)">
    <!-- top-left: half-square triangle block -->
    <rect x="10" y="10" width="52" height="52" fill="#2a9d8f"/>
    <polygon points="10,10 10,62 62,62" fill="#264653"/>

    <!-- plain patches -->
    <rect x="66" y="10" width="24" height="24" fill="#e9c46a"/>
    <rect x="94" y="10" width="24" height="24" fill="#e76f51"/>
    <rect x="66" y="38" width="24" height="24" fill="#f4a261"/>
    <rect x="94" y="38" width="24" height="24" fill="#2a9d8f"/>
    <rect x="10" y="66" width="24" height="24" fill="#e9c46a"/>
    <rect x="38" y="66" width="24" height="24" fill="#e76f51"/>
    <rect x="10" y="94" width="24" height="24" fill="#f4a261"/>
    <rect x="38" y="94" width="24" height="24" fill="#2a9d8f"/>

    <!-- bottom-right: economy block (square in a square in a square) -->
    <rect x="66" y="66" width="52" height="52" fill="#264653"/>
    <polygon points="92,70 114,92 92,114 70,92" fill="#e9c46a"/>
    <rect x="84" y="84" width="16" height="16" fill="#e76f51"/>

    <!-- running stitches -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"
       stroke-dasharray="3 3" stroke-linecap="round">
      <rect x="14" y="14" width="44" height="44"/>
      <line x1="14" y1="14" x2="58" y2="58"/>
      <rect x="70" y="14" width="16" height="16"/>
      <rect x="98" y="14" width="16" height="16"/>
      <rect x="70" y="42" width="16" height="16"/>
      <rect x="98" y="42" width="16" height="16"/>
      <rect x="14" y="70" width="16" height="16"/>
      <rect x="42" y="70" width="16" height="16"/>
      <rect x="14" y="98" width="16" height="16"/>
      <rect x="42" y="98" width="16" height="16"/>
      <rect x="70" y="70" width="44" height="44"/>
    </g>
  </g>
</svg>
